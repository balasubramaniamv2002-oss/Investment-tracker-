<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563EB" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Shield Base -->
  <g filter="url(#glow)">
    <path d="M256 64 L416 128 V272 C416 368 256 448 256 448 C256 448 96 368 96 272 V128 Z" fill="url(#shieldGrad)" />
    <!-- Inner Shield border -->
    <path d="M256 80 L398 138 V266 C398 350 256 422 256 422 C256 422 114 350 114 266 V138 Z" fill="#0F172A" opacity="0.6" />
  </g>

  <!-- Golden Crown / Crest Arc -->
  <path d="M192 120 L256 96 L320 120" stroke="url(#goldAccent)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Stylized "V" for Vestoria with Financial Growth Arrow -->
  <path d="M176 180 L256 340 L336 180" fill="none" stroke="url(#vGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="340" r="18" fill="#10B981" />

  <!-- Indian Rupee Emblem Sparkle -->
  <circle cx="360" cy="150" r="14" fill="url(#goldAccent)" />
</svg>
